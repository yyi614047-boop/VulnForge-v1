[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnforge"
version = "1.0.0"
description = "Local Vulhub vulnerability reproduction workflow"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=0.2,<2",
  "langgraph>=0.2,<2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
metasploit = ["msgpack>=1.0,<2"]

[project.scripts]
vulnforge = "app.cli:main"
vulnforge-batch-rce = "app.batch:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
